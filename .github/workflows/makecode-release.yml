name: MakeCode Arcade Release

# Web build only.
#
# These projects carry a Hub Data bridge (hub.ts), which uses
# control.simmessages - a web-target API with no hardware shim. A physical
# Arcade build cannot compile it: the shim lookup fails, and it takes
# pxt_modules/base/controlmessage.ts and keymap._setSystemKeys with it.
#
# The hardware steps this workflow used to run were each marked
# continue-on-error, so they failed quietly, produced no .uf2, and then
# `cat binary-*.uf2` took the whole job down with "No such file or directory".
# Keeping them would mean a red release every time for a build that cannot
# work while the bridge is present.
#
# What is left is the build that matters: `pxt build --cloud` compiles the web
# game the GitHub Pages site serves. The editor's "create release" is what
# writes that build into assets/; this job is the check that the source still
# compiles.
on:
  release:
    types:
      - created
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
      - name: install node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: install makecode
        run: |
          npm install -g pxt
          pxt target arcade

      - name: build js
        run: |
          pxt clean
          pxt install
          pxt build --cloud
